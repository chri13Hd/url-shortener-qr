<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acortador URL + QR</title>

    <style>
      :root {
        color-scheme: dark;

        --bg0: #05070c;
        --bg1: #070b14;
        --card: rgba(18, 24, 40, 0.62);
        --card2: rgba(18, 24, 40, 0.40);
        --stroke: rgba(255, 255, 255, 0.10);
        --stroke2: rgba(255, 255, 255, 0.08);

        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.60);
        --muted2: rgba(255, 255, 255, 0.48);

        --accent: rgba(124, 180, 255, 0.95);
        --accent2: rgba(124, 180, 255, 0.18);

        --danger: rgba(255, 120, 120, 0.95);

        --r-xl: 22px;
        --r-lg: 16px;
        --r-md: 14px;
        --shadow: 0 18px 60px rgba(0,0,0,0.55);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background:
          radial-gradient(1200px 800px at 20% 10%, rgba(124,180,255,0.14), transparent 60%),
          radial-gradient(900px 700px at 80% 30%, rgba(170,120,255,0.10), transparent 55%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        min-height: 100vh;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 44px 18px 70px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 14px;
        margin-bottom: 14px;
      }

      .title {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.02em;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--stroke);
        background: rgba(255,255,255,0.04);
        color: var(--muted);
      }

      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.4;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow);
        padding: 18px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .card + .card { margin-top: 14px; }

      .row {
        display: flex;
        gap: 10px;
        align-items: stretch;
        flex-wrap: wrap;
      }

      .input, input {
        flex: 1 1 540px;
        min-width: 240px;
        padding: 14px 14px;
        border-radius: var(--r-lg);
        border: 1px solid var(--stroke);
        background: rgba(7, 10, 18, 0.55);
        color: var(--text);
        outline: none;
        transition: box-shadow .15s ease, border-color .15s ease, background .15s ease;
      }

      input::placeholder { color: rgba(255,255,255,0.35); }

      input:focus {
        border-color: rgba(124,180,255,0.55);
        box-shadow: 0 0 0 4px var(--accent2);
        background: rgba(7, 10, 18, 0.72);
      }

      .btn {
        padding: 12px 14px;
        border-radius: var(--r-lg);
        border: 1px solid var(--stroke);
        background: rgba(255,255,255,0.06);
        color: var(--text);
        cursor: pointer;
        font-weight: 600;
        transition: transform .12s ease, filter .12s ease, background .12s ease;
        user-select: none;
      }

      .btn:hover { filter: brightness(1.12); }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }

      .btn-primary {
        background: rgba(124,180,255,0.18);
        border-color: rgba(124,180,255,0.30);
      }

      .btn-ghost {
        background: transparent;
      }

      .status {
        margin-top: 12px;
        color: var(--muted);
        min-height: 18px;
        font-size: 13px;
      }
      .status.error { color: var(--danger); }

      .divider {
        height: 1px;
        background: rgba(255,255,255,0.08);
        margin: 14px 0;
      }

      /* Result */
      .result {
        display: none;
        gap: 14px;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .panel {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--stroke2);
        border-radius: var(--r-xl);
        padding: 14px;
      }

      .result .left { flex: 1 1 520px; }
      .result .right { flex: 0 0 260px; }

      .label {
        font-size: 12px;
        color: var(--muted2);
        margin-top: 12px;
        letter-spacing: 0.02em;
        text-transform: none;
      }

      .linkbox {
        margin-top: 6px;
        padding: 12px;
        border-radius: var(--r-lg);
        background: rgba(7, 10, 18, 0.55);
        border: 1px solid var(--stroke);
        word-break: break-all;
      }

      a {
        color: rgba(124,180,255,0.95);
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }

      .actions {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      img {
        width: 260px;
        height: 260px;
        border-radius: var(--r-xl);
        border: 1px solid var(--stroke);
        background: rgba(7, 10, 18, 0.55);
      }

      .footer {
        margin-top: 12px;
        color: var(--muted2);
        font-size: 12px;
        line-height: 1.4;
      }

      /* History */
      .history-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .history-title {
        display: grid;
        gap: 4px;
      }

      .history-title strong { font-size: 14px; }
      .history-title span { font-size: 12px; color: var(--muted); }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .search {
        min-width: 320px;
        padding: 11px 12px;
        border-radius: var(--r-lg);
        border: 1px solid var(--stroke);
        background: rgba(7, 10, 18, 0.55);
        color: var(--text);
        outline: none;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0 6px;
      }

      .table-wrap {
        overflow: auto;
        border-radius: var(--r-xl);
        border: 1px solid rgba(255,255,255,0.08);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 820px;
        background: rgba(7, 10, 18, 0.35);
      }

      thead th {
        text-align: left;
        color: var(--muted2);
        font-size: 12px;
        font-weight: 600;
        padding: 12px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      tbody td {
        padding: 12px 10px;
        border-top: 1px solid rgba(255,255,255,0.08);
        vertical-align: middle;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
      }

      .ellipsis {
        max-width: 520px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--stroke);
        background: rgba(255,255,255,0.03);
        font-size: 12px;
        color: var(--muted);
      }

      .stack {
        display: inline-flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn-sm {
        padding: 9px 10px;
        border-radius: 12px;
        font-size: 12px;
        background: rgba(255,255,255,0.06);
      }

      .btn-danger {
        border-color: rgba(255, 120, 120, 0.30);
        background: rgba(255, 120, 120, 0.10);
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="title">
          <h1>Acortador URL + QR</h1>
          <!--<span class="pill">Node + Postgres</span> -->
        </div>
      </div>

      <p class="subtitle">Pega una URL, genera el enlace corto y descarga el QR.</p>

      <!-- Input -->
      <div class="card">
        <div class="row">
          <input id="urlInput" type="text" placeholder="https://ejemplo.com/articulo" autocomplete="off" />
          <button id="btnShorten" class="btn btn-primary">Acortar</button>
        </div>

        <div id="status" class="status"></div>

        <!-- Result -->
        <div id="result" class="result" aria-live="polite">
          <div class="left panel">
            <div class="label">URL original</div>
            <div id="originalBox" class="linkbox"></div>

            <div class="label">URL corta</div>
            <div class="linkbox">
              <a id="shortLink" href="#" target="_blank" rel="noreferrer"></a>
            </div>

            <div class="actions">
              <button id="btnCopy" class="btn btn-sm">Copiar enlace</button>
              <button id="btnDownload" class="btn btn-sm">Descargar QR</button>
              <button id="btnOpenQr" class="btn btn-sm btn-ghost">Abrir QR</button>
            </div>

            <div class="footer">
              Tip: al abrir la URL corta, el backend incrementa <code>clicks</code>.
            </div>
          </div>

          <div class="right panel">
            <div class="label">QR</div>
            <img id="qrImg" alt="QR" />
          </div>
        </div>
      </div>

      <!-- History -->
      <div class="card" style="margin-top:14px;">
        <div class="history-head">
          <div class="history-title">
            <strong>Historial</strong>
            <span>Busca por code o por URL original.</span>
          </div>

          <div class="controls">
            <input id="searchInput" class="search" type="text" placeholder="Buscar… (ej: google, abc, youtube)" />
            <button id="btnClearSearch" class="btn btn-sm btn-ghost">Limpiar</button>
            <button id="btnRefresh" class="btn btn-sm">Actualizar</button>
            <button id="btnClearView" class="btn btn-sm btn-ghost" title="Solo limpia la tabla (no borra en BD)">Limpiar vista</button>
          </div>
        </div>

        <div id="historyMeta" class="meta"></div>

        <div class="table-wrap">
          <table id="historyTable">
            <thead>
              <tr>
                <th style="width:120px;">Short</th>
                <th>Original</th>
                <th style="width:90px;">Clicks</th>
                <th style="width:170px;">Creado</th>
                <th style="width:260px;">Acciones</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
